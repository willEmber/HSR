DATA:
  data_name: DIV2K
  # Point to your COCO root directory
  data_root: /data/project/dataset/coco
  # Use the list files you already generated under the COCO root
  train_set: list/train.txt
  val_set: list/valid.txt
  loop: 1
  patch_size: 192
  hflip: True
  rotation: True
  rgb_range: 1.0
  debug: False
  balanceS: True

LOSS:
  loss_lr_weight: 1.0
  # Hyper-parameters for auxiliary losses
  lada: 1.0
  # Stronger low-frequency consistency between stego and cover
  lambda_freq: 2.0
  # Stronger perceptual similarity between stego and cover
  lambda_perc: 0.02
  # Importance-map warmup loss weight
  lambda_imp: 1.0

NETWORK:
  base_resolution: 4
  arch: InvEDRS_arb
  up_sampler: sampleB
  down_sampler: sampleB
  n_resblocks: 16
  n_feats: 64
  fixed_scale: False
  scale: 2
  rescale:
  n_colors: 3
  res_scale: 1
  quantization: True
  quantization_type: round_soft
  K: 4
  num_experts_SAconv: 4
  num_experts_CRM: 8
  jpeg: False

TRAIN:
  use_sgd: False
  sync_bn: True
  train_gpu: [0]
  workers: 16
  batch_size: 20
  batch_size_val: 16
  base_lr: 0.0001
  StepLR: True
  step_size: 60
  gamma: 0.5
  adaptive_lr: False
  factor: 0.3
  patience: 3
  threshold: 0.00025
  poly_lr: False
  epochs: 800
  start_epoch: 0
  power: 0.9
  momentum: 0.9
  weight_decay: 0.002
  manual_seed: 131
  print_freq: 10
  save_freq: 1
  save_path:
  # Fine-tune starting from your previous COCO checkpoint
  weight: LOG/COCO/train_2x_loop2_1005/model/AIDN.pth.tar
  resume:
  evaluate: True
  eval_freq: 20
  warmup_imp_epochs: 5

Distributed:
  dist_url: tcp://127.0.0.1:6799
  dist_backend: "nccl"
  multiprocessing_distributed: True
  world_size: 1
  rank: 0

TEST:
  exp_name: AIDN_COCO_FT
  test_root: ../Data/
  test_dataset: Set5
  test_scale: 1.5+2.5+3.5
  save: True
  split: val
  test_workers: 2
  test_gpu: [0]
  test_batch_size: 1
  model_path:
  save_folder:
  benchmark: False

